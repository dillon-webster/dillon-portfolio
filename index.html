<meta charset="utf-8">
<title>Dillon Webster</title>

<style>
  :root {
    --wall-a:  #14171a;
    --wall-b:  #1d2b38;
    --wall-c:  #2a4459;
    --panel:   #1b1e20;
    --win:     #2a2e32;
    --win-bar: #31363b;
    --win-bar-off: #16232700;
    --edge:    #3f4549;
    --edge-lt: #55606a;
    --text:    #eff0f1;
    --dim:     #a9b3ba;
    --faint:   #7d888f;
    --accent:  #3daee9;
    --mint:    #2ecc71;
    --sky:     #3daee9;
    --rose:    #da4453;
    --sel:     #31485c;
    --shadow:  0 18px 50px rgba(0,0,0,.55), 0 3px 10px rgba(0,0,0,.4);
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--wall-a);
    color: var(--text);
    font-family: var(--ui);
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- wallpaper ---------- */
  #desktop {
    position: fixed;
    inset: 0 0 46px 0;
    background:
      radial-gradient(1200px 700px at 72% 18%, var(--wall-c) 0%, transparent 62%),
      radial-gradient(900px 600px at 12% 88%, #10262d 0%, transparent 60%),
      linear-gradient(160deg, var(--wall-a) 0%, var(--wall-b) 100%);
    overflow: hidden;
  }
  #desktop::after {
    content: "";
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 3px 3px;
    pointer-events: none;
  }

  /* ---------- desktop icons ---------- */
  #icons {
    position: absolute;
    top: 18px; left: 14px;
    display: flex;
    flex-direction: column;
    flex-wrap: wrap;
    align-content: flex-start;
    gap: 4px;
    max-height: calc(100% - 36px);
    z-index: 1;
  }
  .icon {
    width: 96px;
    padding: 9px 4px 7px;
    border: 1px solid transparent;
    border-radius: 6px;
    background: none;
    color: var(--text);
    font: inherit;
    font-size: 12.5px;
    text-align: center;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    line-height: 1.3;
  }
  .icon:hover { background: rgba(255,255,255,.07); }
  .icon:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }
  .icon.sel { background: rgba(61,174,233,.20); border-color: rgba(61,174,233,.55); }
  .icon svg { width: 42px; height: 42px; display: block; filter: drop-shadow(0 2px 3px rgba(0,0,0,.4)); }
  .icon span { word-break: break-word; text-shadow: 0 1px 3px rgba(0,0,0,.8); }

  /* ---------- windows ---------- */
  .window {
    position: absolute;
    display: flex;
    flex-direction: column;
    min-width: 300px;
    min-height: 180px;
    background: var(--win);
    border: 1px solid var(--edge);
    border-radius: 8px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .window.min { display: none; }
  .window.max {
    left: 0 !important; top: 0 !important;
    width: 100% !important; height: 100% !important;
    border-radius: 0;
  }
  .titlebar {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 0 6px 0 11px;
    height: 38px;
    background: var(--win-bar);
    border-bottom: 1px solid var(--edge);
    cursor: grab;
    user-select: none;
    flex: none;
  }
  .window:not(.focused) .titlebar { background: #2c3136; }
  .window:not(.focused) .title { color: var(--faint); }
  .titlebar:active { cursor: grabbing; }
  .title {
    flex: 1;
    font-size: 13.5px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .titlebar .tbicon { width: 17px; height: 17px; flex: none; }
  .wbtn {
    width: 30px; height: 26px;
    border: 0;
    border-radius: 4px;
    background: none;
    color: var(--dim);
    cursor: pointer;
    display: grid;
    place-items: center;
    flex: none;
  }
  .wbtn:hover { background: rgba(255,255,255,.1); color: var(--text); }
  .wbtn.close:hover { background: #b23b32; color: #fff; }
  .wbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .wbtn svg { width: 11px; height: 11px; }

  .wbody { flex: 1; overflow: auto; min-height: 0; }

  .resize {
    position: absolute;
    right: 0; bottom: 0;
    width: 16px; height: 16px;
    cursor: nwse-resize;
  }

  /* ---------- taskbar ---------- */
  #taskbar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: 46px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 10px;
    background: var(--panel);
    border-top: 1px solid var(--edge);
    z-index: 9000;
  }
  #launcher {
    display: flex; align-items: center; gap: 8px;
    height: 34px;
    padding: 0 13px 0 10px;
    border: 1px solid var(--edge);
    border-radius: 5px;
    background: #31363b;
    color: var(--text);
    font: 600 13px var(--ui);
    cursor: pointer;
    flex: none;
  }
  #launcher:hover { background: #3b4248; }
  #launcher:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  #launcher .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
  #tasks { display: flex; gap: 6px; flex: 1; min-width: 0; overflow: hidden; }
  .task {
    display: flex; align-items: center; gap: 7px;
    max-width: 190px;
    height: 34px;
    padding: 0 12px;
    border: 1px solid transparent;
    border-radius: 5px;
    background: rgba(255,255,255,.05);
    color: var(--dim);
    font: 13px var(--ui);
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
  }
  .task svg { width: 15px; height: 15px; flex: none; }
  .task span { overflow: hidden; text-overflow: ellipsis; }
  .task:hover { background: rgba(255,255,255,.1); color: var(--text); }
  .task.active {
    background: rgba(61,174,233,.18);
    border-color: rgba(61,174,233,.5);
    color: var(--text);
  }
  #tray {
    display: flex; align-items: center; gap: 14px;
    color: var(--dim);
    font-size: 12.5px;
    flex: none;
    font-variant-numeric: tabular-nums;
  }
  #tray svg { width: 15px; height: 15px; }

  /* ---------- start menu ---------- */
  #menu {
    position: fixed;
    left: 10px; bottom: 52px;
    width: 268px;
    background: var(--win);
    border: 1px solid var(--edge);
    border-radius: 8px;
    box-shadow: var(--shadow);
    padding: 7px;
    z-index: 9500;
    display: none;
  }
  #menu.open { display: block; }
  #menu .mhead {
    padding: 8px 10px 10px;
    border-bottom: 1px solid var(--edge);
    margin-bottom: 6px;
  }
  #menu .mhead b { display: block; font-size: 13.5px; }
  #menu .mhead small { color: var(--faint); font-size: 11.5px; }
  .mitem {
    display: flex; align-items: center; gap: 10px;
    width: 100%;
    padding: 8px 10px;
    border: 0; border-radius: 5px;
    background: none;
    color: var(--text);
    font: 13px var(--ui);
    text-align: left;
    cursor: pointer;
  }
  .mitem:hover { background: var(--sel); }
  .mitem:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .mitem svg { width: 17px; height: 17px; flex: none; }

  /* ---------- terminal ---------- */
  .term {
    height: 100%;
    background: #1b1e20;
    padding: 12px 14px;
    font: 13.5px/1.55 var(--mono);
    color: #dfe3e6;
    overflow: auto;
    cursor: text;
  }
  .term .fetch {
    display: flex;
    align-items: flex-start;
    gap: 26px;
    margin: 4px 0 10px;
    flex-wrap: wrap;
  }
  .term .art {
    color: #e95420;
    white-space: pre;
    font-size: 9.5px;
    line-height: 1.05;
    flex: none;
    margin: 0;
  }
  .term .info { display: grid; grid-template-columns: auto 1fr; gap: 0 16px; margin: 0; }
  .term .info .who, .term .info .rule {
    grid-column: 1 / -1;
    color: var(--mint);
    font-weight: 600;
  }
  .term .info .rule { color: var(--dim); letter-spacing: -.05em; font-weight: 400; }
  .term .info dt { color: var(--sky); }
  .term .info dd { margin: 0; color: #dfe3e6; }
  @media (max-width: 620px) { .term .art { display: none; } }
  .term .line { white-space: pre-wrap; word-break: break-word; }
  .term .usr { color: var(--mint); }
  .term .pth { color: var(--sky); }
  .term .err { color: var(--rose); }
  .term .dir { color: var(--sky); font-weight: 600; }
  .term .hint { color: var(--faint); }
  .term a { color: var(--accent); }
  .term .row { display: flex; gap: 0; }
  .term input {
    flex: 1;
    border: 0;
    background: none;
    color: #dfe3e6;
    font: inherit;
    outline: none;
    padding: 0;
    min-width: 2ch;
  }
  .term .cols { display: flex; flex-wrap: wrap; gap: 0 22px; }

  /* ---------- file manager ---------- */
  .fm { display: flex; flex-direction: column; height: 100%; background: var(--win); }
  .fm-nav {
    display: flex; align-items: center; gap: 7px;
    padding: 8px 9px;
    border-bottom: 1px solid var(--edge);
    flex: none;
  }
  .navbtn {
    width: 28px; height: 28px;
    border: 1px solid var(--edge);
    border-radius: 5px;
    background: #31363b;
    color: var(--dim);
    cursor: pointer;
    display: grid; place-items: center;
    flex: none;
  }
  .navbtn:hover:not(:disabled) { background: #3b4248; color: var(--text); }
  .navbtn:disabled { opacity: .35; cursor: default; }
  .navbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .navbtn svg { width: 12px; height: 12px; }
  .crumbs {
    flex: 1;
    display: flex; align-items: center; gap: 2px;
    height: 28px;
    padding: 0 10px;
    border: 1px solid var(--edge);
    border-radius: 5px;
    background: #232629;
    font-size: 12.5px;
    overflow: hidden;
    white-space: nowrap;
  }
  .crumb { background: none; border: 0; color: var(--dim); font: inherit; cursor: pointer; padding: 2px 5px; border-radius: 3px; }
  .crumb:hover { background: var(--sel); color: var(--text); }
  .crumb:last-child { color: var(--text); }
  .crumbs .sep { color: var(--faint); }
  .fm-main { flex: 1; display: flex; min-height: 0; }
  .places {
    width: 172px;
    flex: none;
    border-right: 1px solid var(--edge);
    padding: 12px 8px;
    overflow: auto;
  }
  .places h4 {
    margin: 0 0 7px 8px;
    font-size: 10.5px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--faint);
    font-weight: 600;
  }
  .place {
    display: flex; align-items: center; gap: 9px;
    width: 100%;
    padding: 7px 9px;
    border: 0; border-radius: 5px;
    background: none;
    color: var(--dim);
    font: 13px var(--ui);
    text-align: left;
    cursor: pointer;
  }
  .place svg { width: 15px; height: 15px; flex: none; }
  .place:hover { background: rgba(255,255,255,.06); color: var(--text); }
  .place.on { background: var(--sel); color: var(--text); }
  .place:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .fm-grid {
    flex: 1;
    display: flex;
    flex-wrap: wrap;
    align-content: flex-start;
    gap: 6px;
    padding: 16px;
    overflow: auto;
  }
  .fitem {
    width: 104px;
    padding: 12px 6px 9px;
    border: 1px solid transparent;
    border-radius: 6px;
    background: none;
    color: var(--text);
    font: 12.5px var(--ui);
    text-align: center;
    cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    line-height: 1.3;
  }
  .fitem:hover { background: rgba(255,255,255,.06); }
  .fitem.sel { background: var(--sel); border-color: var(--edge-lt); }
  .fitem:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }
  .fitem svg { width: 40px; height: 40px; }
  .fitem span { word-break: break-word; }
  .fm-status {
    flex: none;
    padding: 7px 13px;
    border-top: 1px solid var(--edge);
    font-size: 11.5px;
    color: var(--faint);
    font-family: var(--mono);
  }

  /* ---------- text viewer ---------- */
  .ed { display: flex; flex-direction: column; height: 100%; }
  .ed-tabs {
    display: flex; align-items: center; gap: 6px;
    padding: 7px 9px;
    border-bottom: 1px solid var(--edge);
    flex: none;
  }
  .ed-tab {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 9px 6px 11px;
    border: 1px solid var(--edge);
    border-radius: 5px;
    background: #31363b;
    font-size: 12.5px;
    color: var(--dim);
    cursor: pointer;
  }
  .ed-tab.on { color: var(--text); background: #3b4248; border-color: var(--edge-lt); }
  .ed-tab:hover { color: var(--text); }
  .ed-tab svg { width: 13px; height: 13px; flex: none; }
  .ed-tab .tclose {
    display: grid; place-items: center;
    width: 16px; height: 16px;
    border: 0; border-radius: 3px;
    background: none; color: inherit;
    cursor: pointer; padding: 0;
  }
  .ed-tab .tclose:hover { background: rgba(255,255,255,.16); }
  .ed-tab .tclose svg { width: 8px; height: 8px; }
  .ed-actions { margin-left: auto; display: flex; gap: 7px; flex: none; }
  .ed-act {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 13px;
    border: 1px solid var(--edge);
    border-radius: 5px;
    background: #31363b;
    color: var(--text);
    font: 12.5px var(--ui);
    cursor: pointer;
  }
  .ed-act:hover:not(:disabled) { background: #3b4248; }
  .ed-act:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .ed-act.on { background: var(--accent); border-color: var(--accent); color: #11181d; font-weight: 600; }
  .ed-act:disabled { opacity: .45; cursor: default; }
  .ed-act svg { width: 12px; height: 12px; }

  .ed-src {
    margin: 0;
    padding: 18px 22px 26px;
    font: 13.5px/1.75 var(--mono);
    color: #dfe3e6;
    white-space: pre-wrap;
    word-break: break-word;
    tab-size: 2;
  }
  .ed-src .md-h { color: var(--accent); font-weight: 600; }
  .ed-src .md-b { color: var(--mint); }
  .ed-src .md-u { color: var(--sky); text-decoration: underline; }
  .ed-src .md-l { color: var(--mint); }
  .ed-body, .wbody-inner {
    flex: 1;
    overflow: auto;
    min-height: 0;
    padding: 18px 22px 26px;
    font: 13.5px/1.7 var(--mono);
    color: #dfe3e6;
  }
  .ed-body h1 { font-size: 17px; color: var(--accent); margin: 0 0 14px; font-weight: 600; }
  .ed-body h2 { font-size: 14px; color: var(--sky); margin: 22px 0 8px; font-weight: 600; }
  .ed-body p { margin: 0 0 12px; max-width: 76ch; }
  .ed-body ul { margin: 0 0 12px; padding-left: 20px; max-width: 76ch; }
  .ed-body li { margin-bottom: 6px; }
  .ed-body a { color: var(--accent); }
  .ed-body .shots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; max-width: 76ch; }
  .ed-body .shots img { width: 100%; height: auto; display: block; border: 1px solid var(--edge); border-radius: 3px; }
  .ed-body .shots { align-items: start; }
  /* Landscape tablet captures and portrait phone captures in one grid: two wide
     columns for the tablet shots, and the phone gets its own centred row rather
     than stretching a row to its height and leaving holes beside it. */
  .ed-body .shots.mixed { grid-template-columns: repeat(2, 1fr); }
  .ed-body .shots.mixed img.portrait { grid-column: 1 / -1; justify-self: center; max-width: 210px; }
  /* A paragraph holding a single wide capture spans the grid instead of
     sitting in one narrow column. */
  .ed-body .shots img:only-child { grid-column: 1 / -1; }
  /* A lone landscape capture spans the column; a lone portrait one is a
     photo, not a screenshot, so it stays small and sits left. */
  .ed-body .shots img:only-child.portrait { max-width: 240px; justify-self: start; }
  .ed-body img[data-shot] { cursor: zoom-in; }
  .ed-body img[data-shot]:hover { border-color: #3daee9; }
  .iv { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
        background: #1b1e20; overflow: auto; padding: 8px; }
  .iv img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  .iv { cursor: zoom-out; position: relative; }
  .iv-hint {
    position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%);
    padding: 5px 11px; border-radius: 4px;
    background: rgba(0,0,0,.62); color: #eff0f1;
    font: 12px var(--ui); pointer-events: none;
    opacity: 0; transition: opacity .18s;
  }
  .iv:hover .iv-hint { opacity: 1; }
  @media (max-width: 720px) { .iv-hint { opacity: 1; } }
  .ed-body strong { color: var(--text); }
  .ed-status {
    flex: none;
    display: flex; justify-content: space-between; gap: 16px;
    padding: 7px 13px;
    border-top: 1px solid var(--edge);
    font: 11.5px var(--mono);
    color: var(--faint);
  }

  /* ---------- boot ---------- */
  #boot {
    position: fixed; inset: 0;
    background: #14171a;
    z-index: 9999;
    display: grid;
    place-content: center;
    justify-items: center;
    gap: 26px;
    font-family: var(--mono);
    transition: opacity .45s ease;
  }
  #boot.gone { opacity: 0; pointer-events: none; }
  #boot .logo { font-size: 30px; letter-spacing: .04em; color: var(--accent); font-weight: 300; }
  #boot .bar { width: 210px; height: 3px; background: #31363b; border-radius: 2px; overflow: hidden; }
  #boot .bar i { display: block; height: 100%; width: 0; background: var(--accent); animation: fill 1.15s ease forwards; }
  @keyframes fill { to { width: 100%; } }
  #boot .msg { font-size: 11.5px; color: var(--faint); }

  @media (prefers-reduced-motion: reduce) {
    #boot .bar i { animation-duration: .01s; }
    #boot { transition: none; }
  }


  /* ---------- wallpaper picker ---------- */
  #ctx {
    position: fixed;
    z-index: 9600;
    min-width: 208px;
    background: var(--win);
    border: 1px solid var(--edge);
    border-radius: 7px;
    box-shadow: var(--shadow);
    padding: 6px;
    display: none;
  }
  #ctx.open { display: block; }
  .wp-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    padding: 16px;
  }
  .wp {
    border: 2px solid var(--edge);
    border-radius: 7px;
    padding: 0;
    overflow: hidden;
    cursor: pointer;
    background: none;
    display: flex;
    flex-direction: column;
  }
  .wp:hover { border-color: var(--edge-lt); }
  .wp.on { border-color: var(--accent); }
  .wp:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .wp .swatch { height: 96px; }
  .wp .nm {
    padding: 7px 10px;
    font: 12.5px var(--ui);
    color: var(--text);
    text-align: left;
    background: var(--win-bar);
  }
  .wp.on .nm { color: var(--accent); font-weight: 600; }

  /* ---------- mobile ---------- */
  @media (max-width: 720px) {
    .window { border-radius: 0; }
    .places { display: none; }
    .icon { width: 82px; font-size: 11.5px; }
    .icon svg { width: 36px; height: 36px; }
    #icons { flex-direction: row; flex-wrap: wrap; max-height: none; width: calc(100% - 28px); }
    .task span { display: none; }
    .task { padding: 0 11px; }
    #tray .netlbl { display: none; }
    .ed-body .shots { grid-template-columns: 1fr; }
    .ed-body { padding: 14px 15px 22px; }
  }
</style>

<div id="boot">
  <div class="logo">K<span style="color:#eff0f1">ubuntu</span></div>
  <div class="bar"><i></i></div>
  <div class="msg">starting plasma session&hellip;</div>
</div>

<div id="desktop">
  <div id="icons"></div>
</div>

<div id="ctx" role="menu" aria-label="Desktop"></div>

<div id="menu" role="menu" aria-label="Applications">
  <div class="mhead">
    <b>Dillon Webster</b>
    <small>Dixie Technical College &middot; St. George, UT</small>
  </div>
  <div id="menu-items"></div>
</div>

<div id="taskbar">
  <button id="launcher" aria-haspopup="true" aria-expanded="false">
    <span class="dot"></span> Applications
  </button>
  <div id="tasks"></div>
  <div id="tray">
    <span class="netlbl">tailnet</span>
    <span id="clock">--:--</span>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ============ icon set ============ */

This is the website I built for my dad’s furniture and cabinetry business in
St. George. It includes a gallery of previous work, an online shop, a cart, and
a full checkout system. Customers can pay by card through Square, and once an
order goes through, confirmation emails are sent to both the customer and the
shop.

## Pricing

All of the pricing is handled on the server instead of trusting whatever gets
sent from the browser. The cart only sends product IDs and selected options. The
server looks up the actual price, adjusts it based on things like wood species
or dimensions, calculates tax, and then creates the Square payment.

So even if someone edits the cart or prices in devtools, it only changes what
they see on their screen. It doesn’t change what they actually get charged.

## Tech Stack

- Next.js
- React
- Square
- Resend
- PostHog
- Railway

## Note

This is a real client site for my dad’s business, so the source code is private.
The site is live, and any orders placed through it are real orders that go
directly to the shop.

An iPad bolted to the kitchen wall that never sleeps, and whatever phone is
nearest. It runs the week's dinners, the shopping list, the calendar and the
household jobs. Plan a dinner on the phone and the wall has it a second later.

![Tonight's dinner on the kitchen display](screenshots/hub-home.webp)
![The shopping list, rebuilt from the week's plan](screenshots/hub-shopping.webp)
![The recipe library](screenshots/hub-recipes.webp)
![The household task board](screenshots/hub-tasks.webp)
![The same list on the phone, at the shop](screenshots/phone-list.webp)

## Why

Before this it all lived in the Notes app. We planned the meals in one note and
typed the shopping list into another, both by hand, and keeping the two in
agreement was by hand too. That's the whole reason this exists.

## Shopping list

Nothing called a shopping list is ever written to the database. It gets rebuilt
from the meal plan every time someone opens the page, so it can't drift out of
sync with the plan. There's nothing there to drift.

What does get stored is the part the plan can't tell you: what's already in the
cupboard, what's been crossed off, and whatever someone typed in standing in an
aisle.

## Ingredients

"garlic, thinly sliced" and "garlic, halved" are the same garlic. Everything
past the first comma is prep, so I cut there and merge on what's left. That line
comes out as "2 cloves + 1 head · 2 meals".

Amounts get listed instead of added. Cloves and heads and "a splash" don't sum,
and two numbers that are both right beat one that's confidently wrong.

## Eating out

A night can be planned and have no cooking in it. Marking one "eating out"
counts toward "4 of 7 planned" and puts nothing on the list. Otherwise a planned
night out reads as an empty night and the week looks half-finished when it isn't.

A league tracker for the Madden franchise a friend and I play. The Madden
Companion App exports your league somewhere; this catches that export, stores it
properly, and runs the league off it: standings, results, a Discord bot you can
file a game to from your phone, and a written weekly edition.

None of it is real news. It's a two-person franchise league in a video game, the
teams are the ones that ship with it, and every word of the writing is model
output. The site says as much in its own footer.

![The weekly edition, written by the model](screenshots/mnn-edition.webp)

## The export feed

EA doesn't publish that payload and doesn't hold it still between title updates.
So the schema lives in one generated file built from real captured exports, and
both the table definitions and the upserts are derived from it. When a field
changes I edit one place.

Anything I had to work out by hand stays out of that file, because regenerating
it would wipe it. The one worth telling: winLossStreak arrives as an unsigned
byte, so a losing streak wraps past 127 and 255 actually means "lost one
straight". Believed at face value it renders a 255 game win streak and poisons
whatever gets written from it. The fields sitting right next to it are properly
signed, so it's a quirk of that one field and not a rule about the feed. Team
ids get the same suspicion, since EA's id isn't stable across title updates. It
gets stored as ea_team_id and never used as a primary key.

## Storylines

The league remembers things. A SQL pass over finished games looks for patterns
in what already happened, like a kicker who has missed in three of the last four
weeks or a team on a five game slide, and records each one with a heat value
that climbs while the pattern holds and decays when it stops. Detection is
idempotent per week, so re-syncing an export doesn't double-count a streak or
duplicate a beat.

That table is the league's whole memory and almost none of it goes anywhere.
Before a story is written I pull only the arcs involving the teams playing that
week, hottest first, hard-capped at a handful. Widening that cap is the fastest
way to make this expensive, so it stays small. A running joke can also be
retired by hand, which drops it out of selection entirely instead of leaving it
to fade.

## Writing the edition

Everything the model sees is a fact packet assembled from Postgres: one week of
games, a dozen standings lines, and those few storylines. It's a few kilobytes
whether the league is two seasons old or ten, so the cost doesn't grow with the
history. It also means anything the finished prose states either came from the
packet or was made up, which is what makes checking it afterwards possible.

Two requests a week. One flagship call writes the whole edition, covering the
lead story, the human games, power rankings, the standings narrative, next
week's preview and the prompt for the cover art. One cheap call handles every
CPU-vs-CPU recap in a single batch. Adding teams doesn't change that.

Replies come back through structured outputs against Zod schemas, so what I
parse is an object. Games are referenced by id rather than by matchup, because
the model has no business emitting a score. Scores, records and stat lines
aren't stored on the story at all; the page renders them from the canonical
tables, so an edition published in week 3 still shows correct numbers in week 12.

## The fact guard

The rule is that the model can invent quotes, rumours, hot takes and running
jokes, but never a score, a record, a stat, or a team that doesn't exist.
Prompting alone doesn't guarantee that, so the prose gets checked against the
same packet the model was handed. Any "31-27" in the text has to match a real
final from that week, any "6-1" has to match a real record, and any capitalised
two-to-four letter token shaped like an abbreviation has to be a team in this
league.

A failure isn't fatal. It retries once with the specific complaint, and if it
still fails the story gets stored with the warnings attached, since losing a
whole edition over one bad number would be worse than flagging it. The packet
that produced each story is kept as well, so a bad one can be read back later.

## Filing a game

Filing from Discord runs the same path as the web form, so the two can't drift,
and it costs one round of SQL rather than a model call. What chat adds is
carry-forward and undo: a correction typed on a phone is usually one short line,
so a game's existing editorial fields survive unless the filing explicitly
replaces them.

  function openTerminal() {
    const wrap = document.createElement("div");
    wrap.className = "term";
    wrap.insertAdjacentHTML("beforeend", fetchHTML());

    const hint = document.createElement("div");
    hint.className = "line hint";
    hint.textContent = 'Type "help" for commands. Try: ls, cd projects, cat README.md';
    wrap.appendChild(hint);

    let cwd = [];
    const history = [];
    let hIdx = 0;

    const row = document.createElement("div");
    row.className = "row";
    const prompt = document.createElement("span");
    const input = document.createElement("input");
    input.setAttribute("aria-label", "Terminal input");
    input.autocapitalize = "off";
    input.autocomplete = "off";
    input.spellcheck = false;
    row.appendChild(prompt);
    row.appendChild(input);
    wrap.appendChild(row);

    function drawPrompt() {
      prompt.innerHTML = '<span class="usr">dillon@dillon-pc</span>:' +
        '<span class="pth">' + esc(pathStr(cwd)) + '</span>$&nbsp;';
    }
    function out(html, cls) {
      const d = document.createElement("div");
      d.className = "line" + (cls ? " " + cls : "");
      d.innerHTML = html;
      wrap.insertBefore(d, row);
      return d;
    }
    function scroll() { wrap.scrollTop = wrap.scrollHeight; }

    const CMDS = {
      help() {
        out([
          "ls [dir]        list files",
          "cd &lt;dir&gt;        change directory  (cd .. to go up)",
          "cat &lt;file&gt;      print a file",
          "open &lt;name&gt;     open a project in a window",
          "tree            show everything at once",
          "pwd             where am I",
          "neofetch        system info",
          "clear           clear the screen",
          "exit            close this terminal"
        ].join("\n"), "hint");
      },
      ls(arg) {
        const parts = arg ? normalize(cwd, arg) : cwd;
        const node = resolve(parts);
        if (!node) return out("ls: " + esc(arg) + ": no such file or directory", "err");
        if (node.type === "file") return out(esc(arg));
        const names = Object.keys(node.children);
        if (!names.length) return out("(empty)", "hint");
        out('<span class="cols">' + names.map(n =>
          node.children[n].type === "dir"
            ? '<span class="dir">' + esc(n) + "/</span>"
            : node.children[n].type === "link"
              ? "<span>" + esc(n) + "@</span>"
              : "<span>" + esc(n) + "</span>"
        ).join("") + "</span>");
      },
      cd(arg) {
        if (!arg || arg === "~") { cwd = []; return; }
        const parts = normalize(cwd, arg);
        const node = resolve(parts);
        if (!node) return out("cd: " + esc(arg) + ": no such file or directory", "err");
        if (node.type !== "dir") return out("cd: " + esc(arg) + ": not a directory", "err");
        cwd = parts;
      },
      cat(arg) {
        if (!arg) return out("cat: missing file", "err");
        const node = resolve(normalize(cwd, arg));
        if (!node) return out("cat: " + esc(arg) + ": no such file or directory", "err");
        if (node.type === "dir") return out("cat: " + esc(arg) + ": is a directory", "err");
        if (node.type === "link") return out("[Desktop Entry]\nType=Link\nURL=" + esc(node.url));
        out(esc(node.md));
      },
      open(arg) {
        if (!arg) return out("open: name a project, e.g. open family-hub", "err");
        const key = arg.replace(/\/$/, "");
        if (P[key]) {
          const r = resolve(["projects", key, "README.md"]);
          openDoc("projects/" + key + "/README.md", r);
          return out("opening " + esc(P[key].name) + "&hellip;", "hint");
        }
        const node = resolve(normalize(cwd, arg));
        if (node && node.type === "link") {
          window.open(node.url, "_blank", "noopener");
          return out("opening " + esc(node.url) + "&hellip;", "hint");
        }
        if (node && node.type === "file") {
          openDoc(normalize(cwd, arg).join("/"), node);
          return out("opening " + esc(arg) + "&hellip;", "hint");
        }
        out("open: " + esc(arg) + ": not found. Try: " + ORDER.join(", "), "err");
      },
      tree() {
        const lines = ["~"];
        const walk = (node, pre) => {
          const keys = Object.keys(node.children);
          keys.forEach((k, i) => {
            const last = i === keys.length - 1;
            const child = node.children[k];
            lines.push(pre + (last ? "└── " : "├── ") + k + (child.type === "dir" ? "/" : ""));
            if (child.type === "dir") walk(child, pre + (last ? "    " : "│   "));
          });
        };
        walk(FS, "");
        out(esc(lines.join("\n")));
      },
      pwd() { out(esc(pathStr(cwd))); },
      whoami() { out("dillon"); },
      date() { out(new Date().toString()); },
      neofetch() {
        const d = document.createElement("div");
        d.innerHTML = fetchHTML();
        wrap.insertBefore(d.firstChild, row);
      },
      clear() {
        [...wrap.querySelectorAll(".line, .fetch")].forEach(n => n.remove());
      },
      exit() { closeWin("terminal"); },
      sudo() { out("dillon is not in the sudoers file. This incident will be reported.", "err"); },
      echo(arg) { out(esc(arg || "")); }
    };
    CMDS["ll"] = CMDS.ls;

    function run(raw) {
      const line = raw.trim();
      out('<span class="usr">dillon@dillon-pc</span>:<span class="pth">' +
          esc(pathStr(cwd)) + '</span>$ ' + esc(raw));
      if (!line) return;
      history.push(line); hIdx = history.length;
      const sp = line.indexOf(" ");
      const cmd = (sp === -1 ? line : line.slice(0, sp)).toLowerCase();
      const arg = sp === -1 ? "" : line.slice(sp + 1).trim();
      if (CMDS[cmd]) CMDS[cmd](arg);
      else out(esc(cmd) + ": command not found. Type \"help\".", "err");
    }

    input.addEventListener("keydown", e => {
      if (e.key === "Enter") {
        const v = input.value;
        input.value = "";
        run(v);
        drawPrompt();
        scroll();
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        if (hIdx > 0) input.value = history[--hIdx] || "";
      } else if (e.key === "ArrowDown") {
        e.preventDefault();
        if (hIdx < history.length - 1) input.value = history[++hIdx] || "";
        else { hIdx = history.length; input.value = ""; }
      } else if (e.key === "Tab") {
        e.preventDefault();
        const v = input.value;
        const sp = v.lastIndexOf(" ");
        const head = v.slice(0, sp + 1), frag = v.slice(sp + 1);
        const node = resolve(cwd);
        const pool = sp === -1 ? Object.keys(CMDS) : Object.keys(node.children || {});
        const hits = pool.filter(n => n.startsWith(frag));
        if (hits.length === 1) {
          const n = resolve(normalize(cwd, hits[0]));
          input.value = head + hits[0] + (n && n.type === "dir" ? "/" : "");
        } else if (hits.length > 1) {
          out('<span class="cols">' + hits.map(h => "<span>" + esc(h) + "</span>").join("") + "</span>");
          scroll();
        }
      }
    });

    wrap.addEventListener("mousedown", e => {
      if (e.target.closest("a") || window.getSelection().toString()) return;
      setTimeout(() => input.focus(), 0);
    });

    drawPrompt();
    makeWindow("terminal", {
      title: "Konsole",
      icon: I.term,
      content: wrap,
      w: 760, h: 480,
      onFocus: () => input.focus()
    });
    input.focus();
  }

  /* ============ document viewer (Kate) ============ */
  /* One editor per context. Home docs (about/skills/contact) share a Kate
     window; each project gets its own window titled after the project, so
     opening a README doesn't drag unrelated documents along with it. */
  const editors = new Map();

  function editorKey(id) {
    const parts = id.split("/");
    return (parts[0] === "projects" && parts[1]) ? "proj:" + parts[1] : "kate";
  }

  function editorTitle(key) {
    if (key === "kate") return "Kate";
    const k = key.slice(5);
    return (P[k] && P[k].name) || k;
  }

  function openDoc(id, node) {
    const key = editorKey(id);
    let ed = editors.get(key);

    // A window closed from its titlebar leaves stale state behind, so rebuild
    // whenever the window is gone. Keeps preview/source across a reopen.
    if (!ed || !wins.has(key)) {
      ed = { tabs: [], active: 0, mode: ed ? ed.mode : "preview", el: null, key: key };
      editors.set(key, ed);
    }

    const found = ed.tabs.findIndex(t => t.id === id);
    if (found === -1) {
      ed.tabs.push({ id: id, title: node.title, path: node.path, md: node.md });
      ed.active = ed.tabs.length - 1;
    } else {
      ed.active = found;
    }

    if (!wins.has(key)) {
      const wrap = document.createElement("div");
      wrap.className = "ed";
      wrap.innerHTML =
        '<div class="ed-tabs"></div>' +
        '<div class="wbody-inner"></div>' +
        '<div class="ed-status"><span class="pth"></span><span class="cnt"></span></div>';
      ed.el = wrap;
      makeWindow(key, { title: editorTitle(key), icon: I.doc, content: wrap, w: 780, h: 560 });
    } else {
      focusWin(key);
    }
    drawKate(ed);
  }

  function drawKate(ed) {
    if (!ed || !ed.el) return;
    if (!ed.tabs.length) { closeWin(ed.key); editors.delete(ed.key); return; }
    if (ed.active >= ed.tabs.length) ed.active = ed.tabs.length - 1;

    const doc = ed.tabs[ed.active];
    const tabsEl = ed.el.querySelector(".ed-tabs");
    const bodyEl = ed.el.querySelector(".wbody-inner");
    const pathEl = ed.el.querySelector(".ed-status .pth");
    const cntEl  = ed.el.querySelector(".ed-status .cnt");

    tabsEl.innerHTML = "";
    ed.tabs.forEach((t, i) => {
      const b = document.createElement("button");
      b.className = "ed-tab" + (i === ed.active ? " on" : "");
      b.innerHTML = I.doc + "<span>" + esc(t.title) + "</span>";
      b.addEventListener("click", () => { ed.active = i; drawKate(ed); });
      const x = document.createElement("button");
      x.className = "tclose";
      x.innerHTML = I.x;
      x.setAttribute("aria-label", "Close " + t.title);
      x.addEventListener("click", e => {
        e.stopPropagation();
        ed.tabs.splice(i, 1);
        if (ed.active >= i && ed.active > 0) ed.active--;
        drawKate(ed);
      });
      b.appendChild(x);
      tabsEl.appendChild(b);
    });

    const acts = document.createElement("div");
    acts.className = "ed-actions";
    const prev = document.createElement("button");
    prev.className = "ed-act" + (ed.mode === "preview" ? " on" : "");
    prev.textContent = "Preview";
    prev.setAttribute("aria-pressed", ed.mode === "preview" ? "true" : "false");
    prev.addEventListener("click", () => {
      ed.mode = ed.mode === "preview" ? "source" : "preview";
      drawKate(ed);
    });
    const save = document.createElement("button");
    save.className = "ed-act";
    save.textContent = "Save";
    save.disabled = true;
    save.title = "Nothing to save — this file is read-only";
    acts.appendChild(prev);
    acts.appendChild(save);
    tabsEl.appendChild(acts);

    bodyEl.className = "wbody-inner" + (ed.mode === "preview" ? " ed-body" : "");
    bodyEl.innerHTML = ed.mode === "preview"
      ? renderMd(doc.md)
      : '<pre class="ed-src">' + highlightMd(doc.md) + "</pre>";
    const tagShot = im => {
      if (!im.naturalWidth) return;
      im.classList.add(im.naturalWidth < im.naturalHeight ? "portrait" : "landscape");
      const box = im.closest(".shots");
      if (box && box.querySelector("img.portrait") && box.querySelector("img.landscape"))
        box.classList.add("mixed");
    };
    bodyEl.querySelectorAll("img[data-shot]").forEach(im => {
      im.title = "Click to open full size";
      if (im.complete) tagShot(im);
      else im.addEventListener("load", () => tagShot(im));
      im.addEventListener("click", () => openImage({
        src: im.getAttribute("data-shot"),
        title: im.getAttribute("data-shot").split("/").pop(),
        alt: im.getAttribute("alt")
      }));
    });
    bodyEl.scrollTop = 0;

    pathEl.textContent = (doc.path || "~/" + doc.title).replace("~", "/home/dillon");
    cntEl.textContent = "Saved — " + doc.md.length + " chars";
  }

  /* ============ image viewer ============ */
  function openImage(node) {
    const key = "img:" + (node.path || node.src);
    if (wins.has(key)) { focusWin(key); return; }
    const wrap = document.createElement("div");
    wrap.className = "iv";
    const img = document.createElement("img");
    img.src = IMG[node.src] || node.src;
    img.alt = node.alt || node.title || "";
    wrap.appendChild(img);
    wrap.title = "Click anywhere, or press Esc, to close";
    wrap.addEventListener("click", () => closeWin(key));
    const hint = document.createElement("span");
    hint.className = "iv-hint";
    hint.textContent = "Click anywhere or press Esc to close";
    wrap.appendChild(hint);
    makeWindow(key, { title: node.title || "Image", icon: I.image,
                      content: wrap, w: 980, h: 680 });

  /* ============ file manager ============ */
  function openFiles(startPath) {
    let cwd = startPath || [];
    const back = [], fwd = [];

    const wrap = document.createElement("div");
    wrap.className = "fm";
    wrap.innerHTML =
      '<div class="fm-nav">' +
        '<button class="navbtn b" title="Back" aria-label="Back">' + I.back + "</button>" +
        '<button class="navbtn f" title="Forward" aria-label="Forward">' + I.fwd + "</button>" +
        '<button class="navbtn u" title="Up" aria-label="Up one level">' + I.up + "</button>" +
        '<div class="crumbs"></div>' +
      "</div>" +
      '<div class="fm-main">' +
        '<div class="places"><h4>Places</h4></div>' +
        '<div class="fm-grid"></div>' +
      "</div>" +
      '<div class="fm-status"></div>';

    const crumbs = wrap.querySelector(".crumbs");
    const grid   = wrap.querySelector(".fm-grid");
    const places = wrap.querySelector(".places");
    const status = wrap.querySelector(".fm-status");
    const bBtn = wrap.querySelector(".navbtn.b");
    const fBtn = wrap.querySelector(".navbtn.f");
    const uBtn = wrap.querySelector(".navbtn.u");

    const PLACES = [
      ["Home", [], I.home],
      ["Projects", ["projects"], I.fold]
    ];
    PLACES.forEach(([label, path, icon]) => {
      const b = document.createElement("button");
      b.className = "place";
      b.innerHTML = icon + "<span>" + esc(label) + "</span>";
      b.addEventListener("click", () => go(path.slice()));
      places.appendChild(b);
    });

    function go(parts, noHist) {
      if (!noHist) { back.push(cwd.slice()); fwd.length = 0; }
      cwd = parts;
      render();
    }

    function render() {
      // Walk back to the nearest real directory rather than falling back to
      // Home, which would list the root's contents under whatever path the
      // breadcrumb happens to say.
      while (cwd.length && !resolve(cwd)) cwd = cwd.slice(0, -1);
      const node = resolve(cwd) || FS;

      crumbs.innerHTML = "";
      const mk = (label, parts) => {
        const b = document.createElement("button");
        b.className = "crumb";
        b.textContent = label;
        b.addEventListener("click", () => go(parts));
        return b;
      };
      crumbs.appendChild(mk("Home", []));
      cwd.forEach((seg, i) => {
        crumbs.insertAdjacentHTML("beforeend", '<span class="sep">/</span>');
        crumbs.appendChild(mk(seg, cwd.slice(0, i + 1)));
      });

      [...places.querySelectorAll(".place")].forEach((el, i) => {
        el.classList.toggle("on", PLACES[i][1].join("/") === cwd.join("/"));
      });

      grid.innerHTML = "";
      const names = Object.keys(node.children || {});
      names.forEach(n => {
        const child = node.children[n];
        const b = document.createElement("button");
        b.className = "fitem";
        const isDir = child.type === "dir";
        const isLink = child.type === "link";
        const isImg = child.type === "image";
        b.innerHTML = (isDir ? (child.app ? I.folderBlue : I.folder)
                       : isLink ? I.globe : isImg ? I.image : I.file) +
                      "<span>" + esc(n) + "</span>";
        // Snapshot the directory this button was drawn for. `cwd` is live, so
        // reading it at activation time would append to a path that a previous
        // activation already changed.
        const here = cwd.slice();
        let fired = 0;
        const activate = () => {
          // A real double-click reaches us twice: once via the tap detector
          // below, once via the native dblclick. Only the first should count.
          const now = Date.now();
          if (now - fired < 400) return;
          fired = now;
          if (isDir) go(here.concat(n));
          else if (isLink) window.open(child.url, "_blank", "noopener");
          else if (isImg) openImage(child);
          else openDoc(here.concat(n).join("/"), child);
        };
        b.addEventListener("dblclick", activate);
        b.addEventListener("keydown", e => { if (e.key === "Enter") activate(); });
        let tapped = 0;
        b.addEventListener("click", () => {
          [...grid.querySelectorAll(".fitem")].forEach(x => x.classList.remove("sel"));
          b.classList.add("sel");
          const now = Date.now();
          if (now - tapped < 500) activate();
          tapped = now;
        });
        grid.appendChild(b);
      });

      status.textContent = pathStr(cwd) + " — " + names.length + " item" + (names.length === 1 ? "" : "s");
      bBtn.disabled = !back.length;
      fBtn.disabled = !fwd.length;
      uBtn.disabled = !cwd.length;
    }

    bBtn.addEventListener("click", () => { if (back.length) { fwd.push(cwd.slice()); go(back.pop(), true); } });
    fBtn.addEventListener("click", () => { if (fwd.length) { back.push(cwd.slice()); go(fwd.pop(), true); } });
    uBtn.addEventListener("click", () => { if (cwd.length) go(cwd.slice(0, -1)); });

    render();
    makeWindow("files", { title: "Dolphin", icon: I.fold, content: wrap, w: 800, h: 500 });
  }

  /* ============ desktop icons + menu ============ */
  const ICONS = [
    ["Konsole",   I.term,  () => openTerminal()],
    ["Projects",  I.folder,() => openFiles(["projects"])],
    ["about.md",  I.file,  () => openDoc("about.md", resolve(["about.md"]))],

  ];

  const iconsEl = document.getElementById("icons");
  ICONS.forEach(([label, icon, action]) => {
    const b = document.createElement("button");
    b.className = "icon";
    b.innerHTML = icon + "<span>" + esc(label) + "</span>";
    let tapped = 0, fired = 0;
    const once = () => {
      const now = Date.now();
      if (now - fired < 400) return;   // tap detector and native dblclick both land
      fired = now;
      action();
    };
    b.addEventListener("dblclick", once);
    b.addEventListener("keydown", e => { if (e.key === "Enter") once(); });
    b.addEventListener("click", () => {
      [...iconsEl.querySelectorAll(".icon")].forEach(x => x.classList.remove("sel"));
      b.classList.add("sel");
      const now = Date.now();
      if (now - tapped < 500) once();
      tapped = now;
    });
    iconsEl.appendChild(b);
  });

  const menu = document.getElementById("menu");
  const menuItems = document.getElementById("menu-items");
  const launcher = document.getElementById("launcher");
  const MENU = [
    ["Konsole", I.term, () => openTerminal()],
    ["Dolphin", I.fold, () => openFiles([])],
    ["About me", I.doc, () => openDoc("about.md", resolve(["about.md"]))],
    ["Skills", I.doc, () => openDoc("skills.md", resolve(["skills.md"]))],
    ["Contact", I.doc, () => openDoc("contact.md", resolve(["contact.md"]))],
    ["Desktop Settings", I.chip, () => openWallpaperPicker()]
  ];
  ORDER.forEach(k => MENU.push([P[k].name, I.doc, () =>
    openDoc("projects/" + k + "/README.md", resolve(["projects", k, "README.md"]))]));
  MENU.forEach(([label, icon, action]) => {
    const b = document.createElement("button");
    b.className = "mitem";
    b.innerHTML = icon + "<span>" + esc(label) + "</span>";
    b.addEventListener("click", () => { closeMenu(); action(); });
    menuItems.appendChild(b);
  });
  function closeMenu() { menu.classList.remove("open"); launcher.setAttribute("aria-expanded", "false"); }
  launcher.addEventListener("click", e => {
    e.stopPropagation();
    const open = menu.classList.toggle("open");
    launcher.setAttribute("aria-expanded", open ? "true" : "false");
  });
  document.addEventListener("click", e => {
    if (!menu.contains(e.target) && e.target !== launcher) closeMenu();
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeMenu(); });
  desktop.addEventListener("click", e => {
    if (e.target === desktop || e.target === iconsEl) {
      [...iconsEl.querySelectorAll(".icon")].forEach(x => x.classList.remove("sel"));
    }
  });

     "linear-gradient(170deg, #0b1116 0%, #131b23 100%)"],
    ["Carbon",
     "repeating-linear-gradient(45deg, rgba(255,255,255,.014) 0 2px, transparent 2px 5px)," +
     "linear-gradient(160deg, #16191c 0%, #1e2226 100%)"]
  ];
  let wpIndex = 0;
  try {
    const saved = parseInt(localStorage.getItem("wp"), 10);
    if (!isNaN(saved) && WALLPAPERS[saved]) wpIndex = saved;
  } catch (e) {}

  function applyWallpaper(i) {
    wpIndex = i;
    desktop.style.background = WALLPAPERS[i][1];
    try { localStorage.setItem("wp", String(i)); } catch (e) {}
  }

  function openWallpaperPicker() {
    const wrap = document.createElement("div");
    wrap.className = "wp-grid";
    WALLPAPERS.forEach((w, i) => {
      const b = document.createElement("button");
      b.className = "wp" + (i === wpIndex ? " on" : "");
      b.innerHTML = '<span class="swatch"></span><span class="nm">' + esc(w[0]) + "</span>";
      b.querySelector(".swatch").style.background = w[1];
      b.addEventListener("click", () => {
        applyWallpaper(i);
        [...wrap.querySelectorAll(".wp")].forEach((x, j) => x.classList.toggle("on", j === i));
      });
      wrap.appendChild(b);
    });
    makeWindow("wallpaper", { title: "Desktop Settings", icon: I.chip, content: wrap, w: 480, h: 430 });
  }

  /* right-click the desktop, like a real one */
  const ctx = document.getElementById("ctx");
  function closeCtx() { ctx.classList.remove("open"); }
  desktop.addEventListener("contextmenu", e => {
    if (e.target.closest(".window")) return;
    e.preventDefault();
    ctx.innerHTML = "";
    [["Configure Desktop and Wallpaper…", openWallpaperPicker],
     ["Open Terminal here", openTerminal]].forEach(([label, fn]) => {
      const b = document.createElement("button");
      b.className = "mitem";
      b.textContent = label;
      b.addEventListener("click", () => { closeCtx(); fn(); });
      ctx.appendChild(b);
    });
    ctx.style.left = Math.min(e.clientX, window.innerWidth - 224) + "px";
    ctx.style.top  = Math.min(e.clientY, window.innerHeight - 110) + "px";
    ctx.classList.add("open");
  });
  document.addEventListener("click", closeCtx);
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeCtx(); });

  applyWallpaper(wpIndex);

  /* ============ clock + boot ============ */
  const clock = document.getElementById("clock");
  function tick() {
    clock.textContent = new Date().toLocaleString(undefined, {
      weekday: "short", day: "numeric", month: "short",
      hour: "numeric", minute: "2-digit"
    });
  }
  tick();
  setInterval(tick, 10000);

  const boot = document.getElementById("boot");
  setTimeout(() => {
    boot.classList.add("gone");
    setTimeout(() => boot.remove(), 500);
    openTerminal();
  }, 1250);

})();
</script>
